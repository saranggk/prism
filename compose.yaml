services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prism
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - prism_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prism_postgres:
