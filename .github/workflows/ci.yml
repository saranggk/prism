name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: prism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism -d prism_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRISM_DATABASE_URL: postgresql+psycopg://prism:prism@127.0.0.1:5432/prism_test
      PRISM_TEST_DATABASE_URL: postgresql+psycopg://prism:prism@127.0.0.1:5432/prism_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen
        working-directory: server
      - run: uv run alembic upgrade head
        working-directory: server
      - run: uv run ruff check . ../eval
        working-directory: server
      - run: uv run ruff format --check . ../eval
        working-directory: server
      - run: uv run pytest -q
        working-directory: server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
